<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1c1d1f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sony GRX7">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <title>SONY RM-SR5 // MHC-GRX7</title>
  <style>
    :root {
      --chassis-top: #2a2c30;
      --chassis-bot: #191a1d;
      --well-bg: #121315;
      --key-charcoal: linear-gradient(180deg, #383b40 0%, #26282c 88%, #1e2024 100%);
      --key-charcoal-pressed: linear-gradient(180deg, #1d1f22 0%, #282a2e 100%);
      --key-metal: linear-gradient(180deg, #4a4e54 0%, #32353a 85%, #26292d 100%);
      --key-power: linear-gradient(180deg, #b82828 0%, #8e1818 85%, #6e1010 100%);
      --key-power-pressed: linear-gradient(180deg, #6e1010 0%, #991b1b 100%);
      --silk-white: #d8dce2;
      --silk-dim: #8c929c;
      --silk-amber: #f28c28;
      --silk-cyan: #38d9c0;
      --vfd-cyan: #4effdf;
      --vfd-orange: #ff5522;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 10px;
      background: #0c0d0e;
      color: var(--silk-white);
      font-family: 'Helvetica Neue', Arial, -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    /* Carcaca fisica estilo controle Sony RM-SR5 anos 90 */
    .remote {
      width: 100%;
      max-width: 390px;
      background:
        radial-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 0) 0 0 / 4px 4px,
        linear-gradient(175deg, var(--chassis-top) 0%, #212327 45%, var(--chassis-bot) 100%);
      border-radius: 20px 20px 38px 38px;
      padding: 18px 16px 24px;
      box-shadow:
        0 26px 60px rgba(0, 0, 0, 0.9),
        inset 0 1px 1px rgba(255, 255, 255, 0.18),
        inset 0 -3px 6px rgba(0, 0, 0, 0.85),
        inset 2px 0 3px rgba(255, 255, 255, 0.05),
        inset -2px 0 3px rgba(0, 0, 0, 0.6);
      border: 1px solid #111214;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 4px 9px;
      border-bottom: 2px groove rgba(255, 255, 255, 0.06);
    }

    .sony-logo {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: 3.5px;
      color: #e4e7ec;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      line-height: 1;
    }

    .model-tag {
      display: block;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.56rem;
      font-weight: 700;
      letter-spacing: 1.7px;
      color: var(--silk-dim);
      margin-top: 4px;
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-fs {
      background: #181a1d;
      color: var(--silk-dim);
      border: 1px solid #33373d;
      border-radius: 4px;
      padding: 5px 7px;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 1px 2px rgba(0, 0, 0, 0.6);
    }

    .btn-fs:active {
      background: #121316;
      color: var(--silk-white);
    }

    .ir-window {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0b0506;
      border: 1px solid #2c1618;
      border-radius: 12px;
      padding: 4px 9px;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.9);
    }

    .ir-window span {
      font-size: 0.54rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: #7c686a;
    }

    .ir-led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3a0d11;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.8);
      transition: all 0.05s ease;
    }

    .ir-led.active {
      background: #ff1e27;
      box-shadow: 0 0 10px #ff1e27, 0 0 4px #ff8a80;
    }

    /* Visor VFD (Vacuum Fluorescent Display) inspirado no painel do MHC-GRX7 */
    .vfd-bezel {
      background: #060809;
      border-radius: 6px;
      padding: 9px 11px;
      border: 2px solid #141619;
      box-shadow:
        inset 0 3px 8px rgba(0, 0, 0, 0.95),
        0 1px 0 rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }

    .vfd-bezel::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.32) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
      background-size: 100% 3px, 4px 100%;
      pointer-events: none;
    }

    .vfd-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
      font-size: 0.54rem;
      font-weight: 700;
      letter-spacing: 1.1px;
    }

    .vfd-badge {
      padding: 1px 5px;
      border-radius: 2px;
      border: 1px solid rgba(78, 255, 223, 0.25);
      color: rgba(78, 255, 223, 0.65);
    }

    .vfd-badge.orange {
      border-color: rgba(255, 85, 34, 0.4);
      color: var(--vfd-orange);
      text-shadow: 0 0 6px rgba(255, 85, 34, 0.45);
    }

    .vfd-main {
      font-family: 'Courier New', Consolas, monospace;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: var(--vfd-cyan);
      text-shadow: 0 0 8px rgba(78, 255, 223, 0.55);
      text-transform: uppercase;
      min-height: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .vfd-bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
      flex-shrink: 0;
    }

    .vfd-bars i {
      display: block;
      width: 3px;
      background: var(--vfd-cyan);
      box-shadow: 0 0 4px rgba(78, 255, 223, 0.5);
      opacity: 0.75;
      transition: height 0.12s ease;
    }

    .vfd-bars i:nth-child(1) {
      height: 5px;
    }

    .vfd-bars i:nth-child(2) {
      height: 11px;
    }

    .vfd-bars i:nth-child(3) {
      height: 8px;
    }

    .vfd-bars i:nth-child(4) {
      height: 14px;
      background: var(--vfd-orange);
    }

    .vfd-bars i:nth-child(5) {
      height: 6px;
    }

    .vfd-bars.pulse i:nth-child(1) {
      height: 13px;
    }

    .vfd-bars.pulse i:nth-child(2) {
      height: 6px;
    }

    .vfd-bars.pulse i:nth-child(3) {
      height: 14px;
      background: var(--vfd-orange);
    }

    .vfd-bars.pulse i:nth-child(4) {
      height: 7px;
    }

    .vfd-bars.pulse i:nth-child(5) {
      height: 12px;
    }

    .bay {
      background: var(--well-bg);
      border-radius: 10px;
      padding: 13px 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bay-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bay-title {
      font-size: 0.56rem;
      font-weight: 700;
      letter-spacing: 1.7px;
      text-transform: uppercase;
      color: var(--silk-dim);
      white-space: nowrap;
    }

    .bay-line {
      height: 1px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
    }

    .hw-btn {
      position: relative;
      background: var(--key-charcoal);
      color: var(--silk-white);
      border: 1px solid #101113;
      border-radius: 6px;
      padding: 13px 8px 12px;
      cursor: pointer;
      box-shadow:
        0 3px 0 #0b0c0e,
        0 4px 6px rgba(0, 0, 0, 0.75),
        inset 0 1px 0 rgba(255, 255, 255, 0.16),
        inset 0 -1px 0 rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: transform 0.04s ease, box-shadow 0.04s ease;
      touch-action: manipulation;
    }

    .hw-btn:active,
    .hw-btn.pressed {
      background: var(--key-charcoal-pressed);
      transform: translateY(2px);
      box-shadow:
        0 1px 0 #0b0c0e,
        0 1px 2px rgba(0, 0, 0, 0.6),
        inset 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    .hw-btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .hw-btn .key-main {
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .hw-btn .key-sub {
      font-size: 0.5rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--silk-dim);
    }

    .key-pip {
      width: 14px;
      height: 2px;
      border-radius: 1px;
      background: rgba(255, 255, 255, 0.14);
      margin-bottom: 2px;
    }

    .key-pip.amber {
      background: var(--silk-amber);
      box-shadow: 0 0 5px rgba(242, 140, 40, 0.55);
    }

    .key-pip.cyan {
      background: var(--silk-cyan);
      box-shadow: 0 0 5px rgba(56, 217, 192, 0.55);
    }

    .power-source-row {
      display: grid;
      grid-template-columns: 98px 1fr;
      gap: 12px;
      align-items: stretch;
    }

    .power-well {
      background: #16171a;
      border: 1px solid #2b2e33;
      border-radius: 10px;
      padding: 9px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.8);
    }

    .power-label {
      font-size: 0.5rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: #98a0aa;
    }

    .btn-power {
      width: 100%;
      height: 48px;
      border-radius: 24px;
      background: var(--key-power);
      box-shadow:
        0 3px 0 #3a0808,
        0 4px 7px rgba(0, 0, 0, 0.8),
        inset 0 1px 0 rgba(255, 190, 190, 0.32);
      border: 1px solid #4a0a0a;
      flex-direction: row;
      gap: 5px;
      padding: 0 8px;
    }

    .btn-power:active {
      background: var(--key-power-pressed);
      box-shadow:
        0 1px 0 #3a0808,
        inset 0 2px 4px rgba(0, 0, 0, 0.75);
    }

    .btn-power svg {
      width: 13px;
      height: 13px;
      stroke: #fff;
      stroke-width: 2.2;
      fill: none;
    }

    .btn-power .key-main {
      font-size: 0.7rem;
      color: #fff;
      letter-spacing: 1.1px;
    }

    .btn-sleep {
      width: 100%;
      border-radius: 16px;
      padding: 8px 6px;
      background: linear-gradient(180deg, #32353a 0%, #202226 100%);
    }

    .btn-sleep .key-main {
      font-size: 0.64rem;
      color: var(--silk-cyan);
    }

    .source-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .btn-func-wide {
      grid-column: span 2;
      background: var(--key-metal);
      border-color: #141619;
    }

    .btn-func-wide .key-main {
      color: #ffffff;
      font-size: 0.76rem;
      letter-spacing: 1.2px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 11px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 10px;
    }

    .btn-sound-pro {
      background: var(--key-metal);
      padding: 15px 8px 13px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn-sound-pro .key-main {
      color: var(--silk-amber);
      font-size: 0.82rem;
      letter-spacing: 1.3px;
    }

    .pill-btn {
      border-radius: 18px;
      padding: 11px 8px;
      background: linear-gradient(180deg, #32353a 0%, #202226 100%);
    }

    .pill-btn .key-main {
      font-size: 0.68rem;
      letter-spacing: 1.2px;
    }

    .vol-section {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 13px;
      align-items: stretch;
    }

    .util-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 11px;
    }

    .vol-rocker-well {
      background: #0d0e10;
      border: 1px solid #2b2e34;
      border-radius: 10px;
      padding: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.95);
      position: relative;
    }

    .btn-vol {
      height: 86px;
      background: var(--key-metal);
      border-radius: 7px;
      justify-content: space-between;
      padding: 11px 6px 10px;
    }

    .btn-vol .vol-sym {
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
      line-height: 1;
    }

    .btn-vol .key-main {
      font-size: 0.64rem;
      letter-spacing: 1.2px;
      color: var(--silk-white);
    }

    .tactile-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #b8bec6;
      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.9), inset 0 1px 0 #fff;
    }

    .tactile-spacer {
      width: 5px;
      height: 5px;
    }

    /* Gavetas tecnicas (Scanner SIRC + OTA Firmware) */
    details {
      background: #131417;
      border: 1px solid #26292e;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.7rem;
    }

    summary {
      cursor: pointer;
      color: var(--silk-dim);
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-size: 0.58rem;
      outline: none;
    }

    .lab-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      align-items: center;
    }

    input,
    select {
      background: #0b0c0e;
      color: var(--vfd-cyan);
      border: 1px solid #2b2f36;
      border-radius: 4px;
      padding: 6px 7px;
      font-family: 'Courier New', monospace;
      font-size: 0.72rem;
      font-weight: 700;
      width: 100%;
    }

    input[type="file"] {
      font-size: 0.64rem;
      padding: 5px;
      color: var(--silk-white);
    }

    .btn-lab {
      padding: 7px 10px;
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.9px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .ota-meta {
      margin-top: 8px;
      padding: 6px 8px;
      background: #090a0c;
      border: 1px solid #1f2329;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.64rem;
      color: var(--silk-dim);
      line-height: 1.45;
    }

    .ota-meta b {
      color: var(--vfd-cyan);
    }

    .ota-bar-wrap {
      margin-top: 7px;
      height: 7px;
      background: #090a0c;
      border: 1px solid #262a30;
      border-radius: 4px;
      overflow: hidden;
      display: none;
    }

    .ota-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff5522, #4effdf);
      transition: width 0.12s linear;
    }
  </style>
</head>

<body>
  <div class="remote">
    <!-- Topo da carcaca -->
    <div class="top-bar">
      <div>
        <div class="sony-logo">SONY</div>
        <span class="model-tag">RM-SR5 // MHC-GRX7 </span>
      </div>
      <div class="top-controls">
        <button class="btn-fs" onclick="toggleFullscreen()" title="Alternar Tela Cheia">FULLSCREEN</button>
        <div class="ir-window" title="Transmissor Infravermelho 40kHz">
          <span>SIRC</span>
          <div id="led" class="ir-led"></div>
        </div>
      </div>
    </div>

    <!-- Visor VFD Fluorescente -->
    <div class="vfd-bezel">
      <div class="vfd-top">
        <span id="partBadge" class="vfd-badge">MHC-GRX7</span>
        <span class="vfd-badge orange">HI-FI SYSTEM</span>
        <span id="wsBadge" class="vfd-badge">WS INIT</span>
      </div>
      <div class="vfd-main">
        <span id="status">READY // RM-SR5</span>
        <div id="vfdBars" class="vfd-bars">
          <i></i><i></i><i></i><i></i><i></i>
        </div>
      </div>
    </div>

    <!-- Linha Power (I/O) + Sleep + Seletores de Fonte -->
    <div class="power-source-row">
      <div class="power-well">
        <span class="power-label">I/O STANDBY</span>
        <button class="hw-btn btn-power" onclick="sendKey('power', 'POWER I/O')">
          <svg viewBox="0 0 24 24">
            <path d="M12 2v10" stroke-linecap="round" />
            <path d="M18.4 6.6a9 9 0 1 1-12.8 0" stroke-linecap="round" />
          </svg>
          <span class="key-main">POWER</span>
        </button>
        <button class="hw-btn btn-sleep" onclick="sendKey('sleep', 'SLEEP TIMER')">
          <span class="key-main">SLEEP</span>
          <span class="key-sub">Timer</span>
        </button>
      </div>

      <div class="source-grid">
        <button class="hw-btn btn-func-wide" onclick="sendKey('function', 'FUNCTION')">
          <span class="key-pip cyan"></span>
          <span class="key-main">FUNCTION</span>
          <span class="key-sub">Source Select</span>
        </button>
        <button class="hw-btn" onclick="sendKey('md_video', 'MD / VIDEO')">
          <span class="key-pip cyan"></span>
          <span class="key-main">MD/VID</span>
          <span class="key-sub">Aux In</span>
        </button>
        <button class="hw-btn" onclick="sendKey('cd', 'CD')">
          <span class="key-main">CD</span>
          <span class="key-sub">One Touch</span>
        </button>
        <button class="hw-btn" onclick="sendKey('tuner', 'TUNER / BAND')">
          <span class="key-main">TUNER</span>
          <span class="key-sub">FM / AM</span>
        </button>
        <button class="hw-btn" onclick="sendKey('tape', 'TAPE A/B')">
          <span class="key-main">TAPE</span>
          <span class="key-sub">Deck A/B</span>
        </button>
      </div>
    </div>

    <!-- Processador Acustico, EQ e DJ Effects Sony GRX7 -->
    <div class="bay">
      <div class="bay-header">
        <span class="bay-title">Sound Reinforcement &amp; DJ DSP</span>
        <div class="bay-line"></div>
      </div>
      <div class="grid-2">
        <button class="hw-btn btn-sound-pro" onclick="sendKey('groove', 'GROOVE')">
          <span class="key-pip amber"></span>
          <span class="key-main">GROOVE</span>
          <span class="key-sub">Power Mode</span>
        </button>
        <button class="hw-btn btn-sound-pro" onclick="sendKey('dbfb', 'DBFB BASS')">
          <span class="key-pip amber"></span>
          <span class="key-main">DBFB</span>
          <span class="key-sub">Dynamic Bass</span>
        </button>
      </div>
      <div class="grid-3">
        <button class="hw-btn" onclick="sendKey('eq', 'EQUALIZER')">
          <span class="key-main">EQ</span>
          <span class="key-sub">Band / Curve</span>
        </button>
        <button class="hw-btn" onclick="sendKey('pfile', 'P.FILE')">
          <span class="key-main">P.FILE</span>
          <span class="key-sub">Personal File</span>
        </button>
        <button class="hw-btn" onclick="sendKey('surround', 'SURROUND')">
          <span class="key-main">SURROUND</span>
          <span class="key-sub">Sound Field</span>
        </button>
      </div>
      <div class="grid-3">
        <button class="hw-btn" onclick="sendKey('effect', 'EFFECT')">
          <span class="key-main">EFFECT</span>
          <span class="key-sub">EQ On/Off</span>
        </button>
        <button class="hw-btn" onclick="sendKey('loop', 'DJ LOOP')">
          <span class="key-pip amber"></span>
          <span class="key-main">LOOP</span>
          <span class="key-sub">DJ Sampler</span>
        </button>
        <button class="hw-btn" onclick="sendKey('flash', 'DJ FLASH')">
          <span class="key-pip amber"></span>
          <span class="key-main">FLASH</span>
          <span class="key-sub">DJ Strobe</span>
        </button>
      </div>
    </div>

    <!-- Controle de Volume (Rocker Tatil) + Display / Video Aux -->
    <div class="bay">
      <div class="bay-header">
        <span class="bay-title">Master Volume &amp; Display</span>
        <div class="bay-line"></div>
      </div>
      <div class="vol-section">
        <div class="util-col">
          <button class="hw-btn pill-btn" onclick="sendKey('display', 'DISPLAY')">
            <span class="key-main">DISPLAY</span>
            <span class="key-sub">VFD / Demo</span>
          </button>
          <button class="hw-btn pill-btn" onclick="sendKey('video_aux', 'VIDEO AUX')">
            <span class="key-main">VIDEO AUX</span>
            <span class="key-sub">RCA Input</span>
          </button>
        </div>

        <div class="vol-rocker-well">
          <button class="hw-btn btn-vol" id="btnVolDown">
            <span class="tactile-spacer"></span>
            <span class="vol-sym">&minus;</span>
            <span class="key-main">VOL &minus;</span>
          </button>
          <button class="hw-btn btn-vol" id="btnVolUp">
            <span class="tactile-dot" title="Ponto tatil de referencia"></span>
            <span class="vol-sym">+</span>
            <span class="key-main">VOL +</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Scanner Tecnico Sony SIRC + Presets Alternativos 12b/15b/20b + Auto-Scan -->
    <details>
      <summary>SIRC Code Transmitter &amp; Auto-Scanner</summary>
      <div class="lab-row">
        <select id="presetSelect" onchange="applyPreset()">
          <option value="">-- TESTAR VARIANTES 12B / 15B / 20B --</option>
          <option value="0x5E1:12">GROOVE Alt (0x5E1 - 12b Addr 0x10)</option>
          <option value="0x2F08:15">GROOVE Padrao (0x2F08 - 15b Addr 0x10)</option>
          <option value="0x8C6:12">DBFB Alt (0x8C6 - 12b Addr 0x0C)</option>
          <option value="0x5909:15">DBFB / Bass (0x5909 - 15b Addr 0x90)</option>
          <option value="0x4B09:15">FUNCTION (0x4B09 - 15b Addr 0x90)</option>
          <option value="0x966:12">FUNCTION Alt (0x966 - 12b Addr 0x0C)</option>
          <option value="0x6309:15">EQ (0x6309 - 15b Addr 0x90)</option>
          <option value="0x3B09:15">PRESET EQ / P.FILE (0x3B09 - 15b)</option>
          <option value="0xEEB9C:20">EQ EDIT (0xEEB9C - 20b Addr 26.57)</option>
          <option value="0x0109:15">SURROUND (0x0109 - 15b Addr 0x90)</option>
          <option value="0x7D09:15">SURROUND Alt (0x7D09 - 15b Cmd 95)</option>
          <option value="0xFC6:12">SURROUND 12b (0xFC6 - 12b Addr 0x0C)</option>
          <option value="0x4D1:12">CD PLAY 12b (0x4D1 - 12b Addr 0x11)</option>
          <option value="0x1D1:12">CD STOP 12b (0x1D1 - 12b Addr 0x11)</option>
          <option value="0x7D1:12">DISC SKIP 12b (0x7D1 - 12b Addr 0x11)</option>
          <option value="0xEEB99:20">DJ FLASH (0xEEB99 - 20b Addr 26.153)</option>
        </select>
      </div>
      <div class="lab-row">
        <input id="hexInput" type="text" value="0x4B09" placeholder="Hex (0x4B09)">
        <select id="bitsInput" style="width:94px">
          <option value="12">12-BIT</option>
          <option value="15" selected>15-BIT</option>
          <option value="20">20-BIT</option>
        </select>
        <button class="hw-btn btn-lab" onclick="sendRawHex()">SEND</button>
      </div>
      <div class="lab-row">
        <input id="cmdNum" type="number" min="0" max="127" value="0" style="width:74px" placeholder="Cmd">
        <select id="addrNum">
          <option value="16" data-bits="12" selected>0x10 Amp (12b)</option>
          <option value="144" data-bits="15">0x90 Audio/EQ (15b)</option>
          <option value="16" data-bits="15">0x10 Amp Ext (15b)</option>
          <option value="1850" data-bits="20">26.57 Deck/Menu (20b)</option>
          <option value="4922" data-bits="20">26.153 DJ Flash (20b)</option>
          <option value="17" data-bits="12">0x11 CD (12b)</option>
          <option value="13" data-bits="12">0x0D Tuner (12b)</option>
          <option value="12" data-bits="12">0x0C DSP Old (12b)</option>
          <option value="18" data-bits="12">0x12 GEQ (12b)</option>
        </select>
      </div>
      <div class="lab-row">
        <button class="hw-btn btn-lab" onclick="stepCmd(-1)">&minus;</button>
        <button class="hw-btn btn-lab" onclick="stepCmd(0)">TEST CMD</button>
        <button class="hw-btn btn-lab" onclick="stepCmd(1)">+</button>
        <button class="hw-btn btn-lab" id="btnAutoScan"
          style="flex:1; color:#4effdf; border-color:rgba(78,255,223,0.35);" onclick="toggleAutoScan()">
          AUTO SCAN 0-127
        </button>
      </div>
      <div class="lab-row">
        <button class="hw-btn btn-lab" style="width:100%; padding:9px; color:#ff9e40; border-color:rgba(255,111,0,0.4);"
          onclick="sendKey('cam_test', 'IR LED CAMERA BURST (1.5s)')">
          IR CAMERA BEACON TEST (1.5s BURST)
        </button>
      </div>
    </details>

    <!-- Gaveta de Atualizacao OTA com Particao Dupla e Fallback -->
    <details ontoggle="if(this.open) loadOtaInfo()">
      <summary>Firmware Update (OTA &amp; Fallback)</summary>
      <div id="otaMeta" class="ota-meta">
        Carregando informacoes da particao OTA...
      </div>
      <div class="lab-row">
        <input type="file" id="otaFile" accept=".bin,application/octet-stream">
      </div>
      <div id="otaBarWrap" class="ota-bar-wrap">
        <div id="otaBar" class="ota-bar"></div>
      </div>
      <div class="lab-row">
        <button class="hw-btn btn-lab" id="btnOtaUpload"
          style="flex:1; color:#4effdf; border-color:rgba(78,255,223,0.4);" onclick="uploadOta()">
          UPLOAD FIRMWARE (.BIN)
        </button>
        <button class="hw-btn btn-lab" id="btnOtaRollback" style="color:#ff9e40; border-color:rgba(255,111,0,0.4);"
          onclick="triggerRollback()" disabled>
          FALLBACK
        </button>
      </div>
    </details>
  </div>

  <script>
    const led = document.getElementById('led');
    const status = document.getElementById('status');
    const vfdBars = document.getElementById('vfdBars');
    const wsBadge = document.getElementById('wsBadge');
    const partBadge = document.getElementById('partBadge');

    let ws = null;
    let wsReconnectTimer = null;
    let scanTimer = null;

    function connectWS() {
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
        return;
      }
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(proto + '//' + location.host + '/ws');

      ws.onopen = () => {
        wsBadge.textContent = 'WS ONLINE';
        wsBadge.style.color = '#4effdf';
      };

      ws.onmessage = (ev) => {
        status.textContent = ev.data;
      };

      ws.onclose = () => {
        wsBadge.textContent = 'HTTP MODE';
        wsBadge.style.color = '';
        clearTimeout(wsReconnectTimer);
        wsReconnectTimer = setTimeout(connectWS, 1200);
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        connectWS();
      }
    });
    connectWS();

    function pulseFeedback(msg) {
      if (navigator.vibrate) navigator.vibrate(18);
      led.classList.add('active');
      vfdBars.classList.add('pulse');
      status.textContent = msg;
      setTimeout(() => {
        led.classList.remove('active');
        vfdBars.classList.remove('pulse');
      }, 150);
    }

    async function sendKey(key, label) {
      pulseFeedback('TX: ' + label);
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send('cmd:' + key);
        return;
      }
      try {
        const r = await fetch('/api/cmd?key=' + encodeURIComponent(key), { method: 'POST' });
        const txt = await r.text();
        status.textContent = 'OK // ' + txt;
      } catch (e) {
        status.textContent = 'ERR // NO LINK';
      }
    }

    function applyPreset() {
      const val = document.getElementById('presetSelect').value;
      if (!val) return;
      const parts = val.split(':');
      document.getElementById('hexInput').value = parts[0];
      document.getElementById('bitsInput').value = parts[1];
      sendRawHex();
    }

    async function sendRawHex() {
      const hex = document.getElementById('hexInput').value.trim();
      const bits = document.getElementById('bitsInput').value;
      pulseFeedback('RAW ' + hex + ' [' + bits + 'B]');
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send('raw:' + hex + ':' + bits);
        return;
      }
      const r = await fetch(`/api/raw?data=${encodeURIComponent(hex)}&bits=${bits}`, { method: 'POST' });
      status.textContent = await r.text();
    }

    async function stepCmd(delta) {
      const el = document.getElementById('cmdNum');
      let cmd = (parseInt(el.value || '0', 10) + delta + 128) % 128;
      el.value = cmd;
      const addrSel = document.getElementById('addrNum');
      const addr = parseInt(addrSel.value, 10);
      const opt = addrSel.options[addrSel.selectedIndex];
      const bits = opt && opt.dataset.bits ? parseInt(opt.dataset.bits, 10) : 12;
      pulseFeedback(`CMD=${cmd} ADDR=${addr} (${bits}B)`);
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(`sirc:${cmd}:${addr}:${bits}`);
        return;
      }
      const r = await fetch(`/api/sirc?cmd=${cmd}&addr=${addr}&bits=${bits}`, { method: 'POST' });
      status.textContent = await r.text();
    }

    function toggleAutoScan() {
      const btn = document.getElementById('btnAutoScan');
      if (scanTimer) {
        clearInterval(scanTimer);
        scanTimer = null;
        btn.textContent = 'AUTO SCAN 0-127';
        status.textContent = 'SCAN PAUSED';
        return;
      }
      btn.textContent = 'STOP SCAN';
      scanTimer = setInterval(() => {
        const el = document.getElementById('cmdNum');
        let next = (parseInt(el.value || '0', 10) + 1) % 128;
        // Pula Power Toggle (21) e Power Off discreto (47) para nao desligar o som no meio da varredura!
        if (next === 21 || next === 47) next = (next + 1) % 128;
        el.value = next;
        stepCmd(0);
      }, 1150);
    }

    async function loadOtaInfo() {
      const meta = document.getElementById('otaMeta');
      const rbBtn = document.getElementById('btnOtaRollback');
      try {
        const r = await fetch('/api/ota/info');
        const d = await r.json();
        partBadge.textContent = d.running.toUpperCase();
        meta.innerHTML =
          `SLOT ATIVO: <b>${d.running}</b> (${d.addr}) [${d.state}]<br>` +
          `PROXIMO SLOT: <b>${d.next}</b> (${d.size_kb} KB) // VER: <b>${d.ver}</b>`;
        rbBtn.disabled = !d.can_rollback;
      } catch (e) {
        meta.textContent = 'Erro ao ler status OTA.';
      }
    }

    function uploadOta() {
      const fileInput = document.getElementById('otaFile');
      if (!fileInput.files || !fileInput.files.length) {
        status.textContent = 'SELECIONE O .BIN';
        return;
      }
      const file = fileInput.files[0];
      const btn = document.getElementById('btnOtaUpload');
      const barWrap = document.getElementById('otaBarWrap');
      const bar = document.getElementById('otaBar');

      btn.disabled = true;
      barWrap.style.display = 'block';
      bar.style.width = '0%';
      status.textContent = 'OTA STARTING...';

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/ota', true);
      xhr.setRequestHeader('Content-Type', 'application/octet-stream');

      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          const pct = Math.round((e.loaded / e.total) * 100);
          bar.style.width = pct + '%';
          status.textContent = `OTA UPLOAD: ${pct}%`;
        }
      };

      xhr.onload = () => {
        btn.disabled = false;
        if (xhr.status === 200) {
          bar.style.width = '100%';
          status.textContent = 'OTA OK // REBOOTING...';
          setTimeout(() => location.reload(), 6500);
        } else {
          status.textContent = 'OTA ERR // ' + (xhr.responseText || xhr.status);
        }
      };

      xhr.onerror = () => {
        btn.disabled = false;
        status.textContent = 'OTA NETWORK ERROR';
      };

      xhr.send(file);
    }

    async function triggerRollback() {
      if (!confirm('Reverter para o firmware da particao anterior e reiniciar o ESP32?')) return;
      status.textContent = 'ROLLBACK REBOOT...';
      try {
        const r = await fetch('/api/ota/rollback', { method: 'POST' });
        if (r.ok) {
          setTimeout(() => location.reload(), 6000);
        } else {
          status.textContent = 'ERR // NO FALLBACK';
        }
      } catch (e) {
        status.textContent = 'ERR // ROLLBACK';
      }
    }

    function setupHoldButton(id, key, label) {
      const btn = document.getElementById(id);
      let timer = null;
      const start = (e) => {
        e.preventDefault();
        btn.classList.add('pressed');
        sendKey(key, label);
        timer = setInterval(() => sendKey(key, label), 150);
      };
      const stop = () => {
        btn.classList.remove('pressed');
        if (timer) { clearInterval(timer); timer = null; }
      };
      btn.addEventListener('touchstart', start, { passive: false });
      btn.addEventListener('touchend', stop);
      btn.addEventListener('touchcancel', stop);
      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', stop);
      btn.addEventListener('mouseleave', stop);
    }

    setupHoldButton('btnVolUp', 'vol_up', 'VOLUME +');
    setupHoldButton('btnVolDown', 'vol_down', 'VOLUME -');

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => { });
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }

    loadOtaInfo();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => { });
    }
  </script>
</body>

</html>
