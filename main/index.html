<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sony GRX7 Remote</title>
<style>
  :root {
    --bg: #0d0f12;
    --body-grad: linear-gradient(160deg, #1b1f27 0%, #101217 100%);
    --btn-bg: linear-gradient(145deg, #262b36, #1a1e26);
    --btn-active: linear-gradient(145deg, #161920, #232832);
    --accent: #ff5722;
    --power: #e53935;
    --md-color: #00acc1;
    --bass-color: #ffb300;
    --text: #eceff4;
    --subtext: #8f9bb3;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    margin: 0; padding: 12px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex; justify-content: center;
    min-height: 100vh;
  }
  .remote {
    width: 100%; max-width: 390px;
    background: var(--body-grad);
    border-radius: 32px;
    padding: 20px 18px 26px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.1);
    border: 1px solid #2a2f3a;
    display: flex; flex-direction: column; gap: 16px;
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 6px 8px; border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .brand { font-weight: 800; letter-spacing: 3px; font-size: 1.15rem; color: #fff; }
  .model { font-size: 0.72rem; color: var(--accent); font-weight: 700; letter-spacing: 1.2px; display: block; margin-top: 2px; }
  .ir-led {
    width: 12px; height: 12px; border-radius: 50%;
    background: #331515; border: 1px solid #552222;
    transition: all 0.08s ease;
  }
  .ir-led.active {
    background: #ff1744;
    box-shadow: 0 0 14px #ff1744, 0 0 24px #ff5252;
  }
  .section-label {
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--subtext); margin: 2px 4px -8px; font-weight: 600;
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  button {
    background: var(--btn-bg);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 16px 10px;
    font-size: 0.92rem; font-weight: 700;
    box-shadow: 4px 6px 14px rgba(0,0,0,0.45), -2px -2px 8px rgba(255,255,255,0.03);
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    transition: transform 0.06s ease, box-shadow 0.06s ease;
    touch-action: manipulation;
  }
  button:active, button.pressed {
    background: var(--btn-active);
    transform: scale(0.96);
    box-shadow: inset 2px 3px 8px rgba(0,0,0,0.7);
  }
  button .sub { font-size: 0.65rem; font-weight: 500; color: var(--subtext); }
  .btn-power {
    background: linear-gradient(145deg, #d32f2f, #9a0007);
    border-color: rgba(255,120,120,0.25);
    color: #fff;
  }
  .btn-md {
    background: linear-gradient(145deg, #00838f, #005662);
    border-color: rgba(0,229,255,0.25);
  }
  .btn-vol {
    padding: 24px 12px;
    font-size: 1.35rem;
    border-radius: 22px;
    border-color: rgba(255,255,255,0.12);
  }
  .btn-groove {
    background: linear-gradient(145deg, #ff6f00, #c43e00);
    border-color: rgba(255,193,7,0.35);
    color: #fff;
  }
  .btn-dbfb {
    border-color: rgba(255,179,0,0.35);
    color: #ffd54f;
  }
  .status-bar {
    background: #090b0e;
    border: 1px solid #222834;
    border-radius: 12px;
    padding: 10px 12px;
    font-family: monospace;
    font-size: 0.78rem;
    color: #4fc3f7;
    text-align: center;
    min-height: 36px;
    display: flex; align-items: center; justify-content: center;
  }
  details {
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 10px 12px;
    font-size: 0.8rem;
  }
  summary { cursor: pointer; color: var(--subtext); font-weight: 600; outline: none; }
  .lab-row { display: flex; gap: 6px; margin-top: 10px; align-items: center; }
  input, select {
    background: #12151c; color: #fff; border: 1px solid #323949;
    border-radius: 8px; padding: 8px; font-size: 0.82rem; width: 100%;
  }
  .btn-sm { padding: 9px 12px; font-size: 0.78rem; border-radius: 10px; flex-shrink: 0; }
</style>
</head>
<body>
  <div class="remote">
    <div class="header">
      <div>
        <div class="brand">SONY</div>
        <span class="model">MHC-GRX7 CONTROLLER</span>
      </div>
      <div id="led" class="ir-led" title="Indicador IR"></div>
    </div>

    <div id="status" class="status-bar">PRONTO (MD / TV CHROMECAST)</div>

    <div class="section-label">Energia &amp; Entrada</div>
    <div class="grid-2">
      <button class="btn-power" onclick="sendKey('power', 'POWER (0xA81)')">
        <span>&#x23FB; POWER</span>
        <span class="sub" style="color:#ffcdd2">Liga / Desliga</span>
      </button>
      <button class="btn-md" onclick="sendKey('md', 'ENTRADA MD (0x621)')">
        <span>&#x1F4BF; MD / VIDEO</span>
        <span class="sub" style="color:#b2ebf2">Entrada Direta</span>
      </button>
    </div>
    <div class="grid-2">
      <button onclick="sendKey('function', 'FUNCTION (0x4B09)')">
        <span>&#x1F501; FUNCTION</span>
        <span class="sub">Alternar Entrada</span>
      </button>
      <button onclick="sendKey('video_aux', 'VIDEO/AUX (0x441)')">
        <span>&#x1F4FA; VIDEO / AUX</span>
        <span class="sub">Alternativo 12-bit</span>
      </button>
    </div>

    <div class="section-label">Controle de Volume (Segure para repetir)</div>
    <div class="grid-2">
      <button class="btn-vol" id="btnVolDown">
        <span>VOL &minus;</span>
        <span class="sub">Diminuir</span>
      </button>
      <button class="btn-vol" id="btnVolUp">
        <span>VOL +</span>
        <span class="sub">Aumentar</span>
      </button>
    </div>
    <div class="grid-2">
      <button onclick="sendKey('mute', 'MUTE (0x281)')" style="padding:12px">
        <span>&#x1F507; MUTE</span>
        <span class="sub">Silenciar</span>
      </button>
      <button onclick="sendKey('display', 'DISPLAY (0xD21)')" style="padding:12px">
        <span>&#x1F4DF; DISPLAY</span>
        <span class="sub">Visor / Demo Off</span>
      </button>
    </div>

    <div class="section-label">Graves &amp; Equalizador GRX7</div>
    <div class="grid-2">
      <button class="btn-groove" onclick="sendKey('groove', 'GROOVE (0x1309)')">
        <span>&#x1F525; GROOVE</span>
        <span class="sub" style="color:#ffe0b2">Reforco Total</span>
      </button>
      <button class="btn-dbfb" onclick="sendKey('dbfb', 'DBFB BASS (0x2309)')">
        <span>&#x1F4A5; DBFB</span>
        <span class="sub">Dynamic Bass</span>
      </button>
    </div>
    <div class="grid-3">
      <button onclick="sendKey('eq', 'EQ / EFFECT (0x6309)')">
        <span>&#x1F39B; EQ</span>
        <span class="sub">Preset</span>
      </button>
      <button onclick="sendKey('effect', 'EFFECT (0xF81)')">
        <span>&#x2728; EFFECT</span>
        <span class="sub">On / Off</span>
      </button>
      <button onclick="sendKey('surround', 'SURROUND (0xD41)')">
        <span>&#x1F50A; SURR</span>
        <span class="sub">Modo</span>
      </button>
    </div>

    <details>
      <summary>&#x1F50D; Testador / Scanner de Codigos Sony</summary>
      <div class="lab-row">
        <input id="hexInput" type="text" value="0xA81" placeholder="Hex (ex: 0xA81)">
        <select id="bitsInput" style="width:95px">
          <option value="12" selected>12 bits</option>
          <option value="15">15 bits</option>
          <option value="20">20 bits</option>
        </select>
        <button class="btn-sm" onclick="sendRawHex()">Enviar</button>
      </div>
      <div class="lab-row">
        <input id="cmdNum" type="number" min="0" max="127" value="21" placeholder="Cmd (0-127)">
        <select id="addrNum" style="width:120px">
          <option value="16" selected>Addr 16 (12b)</option>
          <option value="144">Addr 144 (15b)</option>
          <option value="80">Addr 80 (15b)</option>
        </select>
        <button class="btn-sm" onclick="stepCmd(-1)">&minus;</button>
        <button class="btn-sm" onclick="stepCmd(0)">Testar</button>
        <button class="btn-sm" onclick="stepCmd(1)">+</button>
      </div>
    </details>
  </div>

<script>
  const led = document.getElementById('led');
  const status = document.getElementById('status');

  function pulseFeedback(msg) {
    if (navigator.vibrate) navigator.vibrate(30);
    led.classList.add('active');
    status.textContent = msg;
    setTimeout(() => led.classList.remove('active'), 180);
  }

  async function sendKey(key, label) {
    pulseFeedback('ENVIANDO: ' + label);
    try {
      const r = await fetch('/api/cmd?key=' + encodeURIComponent(key), { method: 'POST' });
      const txt = await r.text();
      status.textContent = 'OK: ' + txt;
    } catch (e) {
      status.textContent = 'ERRO DE CONEXAO';
    }
  }

  async function sendRawHex() {
    const hex = document.getElementById('hexInput').value.trim();
    const bits = document.getElementById('bitsInput').value;
    pulseFeedback('RAW ' + hex + ' (' + bits + 'b)');
    const r = await fetch(`/api/raw?data=${encodeURIComponent(hex)}&bits=${bits}`, { method: 'POST' });
    status.textContent = await r.text();
  }

  async function stepCmd(delta) {
    const el = document.getElementById('cmdNum');
    let cmd = (parseInt(el.value || '0', 10) + delta + 128) % 128;
    el.value = cmd;
    const addr = parseInt(document.getElementById('addrNum').value, 10);
    const bits = (addr > 31) ? 15 : 12;
    pulseFeedback(`SCAN CMD=${cmd} ADDR=${addr}`);
    const r = await fetch(`/api/sirc?cmd=${cmd}&addr=${addr}&bits=${bits}`, { method: 'POST' });
    status.textContent = await r.text();
  }

  function setupHoldButton(id, key, label) {
    const btn = document.getElementById(id);
    let timer = null;
    const start = (e) => {
      e.preventDefault();
      btn.classList.add('pressed');
      sendKey(key, label);
      timer = setInterval(() => sendKey(key, label), 260);
    };
    const stop = () => {
      btn.classList.remove('pressed');
      if (timer) { clearInterval(timer); timer = null; }
    };
    btn.addEventListener('touchstart', start, { passive: false });
    btn.addEventListener('touchend', stop);
    btn.addEventListener('touchcancel', stop);
    btn.addEventListener('mousedown', start);
    btn.addEventListener('mouseup', stop);
    btn.addEventListener('mouseleave', stop);
  }

  setupHoldButton('btnVolUp', 'vol_up', 'VOLUME + (0x481)');
  setupHoldButton('btnVolDown', 'vol_down', 'VOLUME - (0xC81)');
</script>
</body>
</html>
